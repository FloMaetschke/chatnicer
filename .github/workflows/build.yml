name: Build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  # Auf main NICHT abbrechen: dort haengt das Release am Lauf, und ein mitten im
  # Veroeffentlichen abgeschossener Job kann den Tag geloescht und das Release noch
  # nicht angelegt haben. PR-Laeufe duerfen sich weiter gegenseitig ersetzen.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  #  Der Weg, den auch ein Entwickler lokal geht: build.bat, beide Varianten.
  #  build.bat sucht sich die VS-Umgebung selbst (vswhere), auf dem Runner ist
  #  VS 2022 mit den VC++-Tools vorinstalliert - kein Setup-Schritt noetig.
  # ---------------------------------------------------------------------------
  build:
    name: build.bat (Standard + compat)
    runs-on: windows-latest

    env:
      # Groessenbudget aus CLAUDE.md: 200 KB = 204.800 Bytes.
      SIZE_BUDGET: '204800'
      # Die compat-Variante liegt derzeit bewusst darueber (siehe CLAUDE.md,
      # Abschnitt "Harte Randbedingungen"). Auf 'true' setzen, sobald sie wieder
      # unter dem Budget liegt - dann bricht der Lauf statt nur zu warnen.
      ENFORCE_COMPAT_BUDGET: 'false'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Standard-Release bauen
        shell: cmd
        run: build.bat

      - name: compat-Variante bauen
        shell: cmd
        run: build.bat compat

      - name: Groesse gegen Budget pruefen
        shell: pwsh
        run: |
          $budget = [int]$env:SIZE_BUDGET
          $enforceCompat = $env:ENFORCE_COMPAT_BUDGET -eq 'true'
          $failed = $false

          $variants = @(
            @{ File = 'build\ChatNicer.exe';        Enforce = $true },
            @{ File = 'build\ChatNicer-compat.exe'; Enforce = $enforceCompat }
          )

          $rows = @()
          foreach ($v in $variants) {
            if (-not (Test-Path $v.File)) {
              Write-Host "::error::$($v.File) wurde nicht erzeugt"
              $failed = $true
              continue
            }

            $name = Split-Path $v.File -Leaf
            $size = (Get-Item $v.File).Length
            $hash = (Get-FileHash $v.File -Algorithm SHA256).Hash

            if ($size -gt $budget) {
              $over = $size - $budget
              $msg  = "$name : $size Bytes, $over Bytes ueber dem Budget von $budget Bytes"
              if ($v.Enforce) {
                Write-Host "::error::$msg"
                $failed = $true
                $status = 'ueber Budget'
              } else {
                Write-Host "::warning::$msg"
                $status = 'ueber Budget (geduldet)'
              }
            } else {
              $status = "ok ($($budget - $size) Bytes Reserve)"
            }

            Write-Host "$name : $size Bytes - $status"
            Write-Host "  SHA256 $hash"
            $rows += "| $name | $size | $budget | $status | $hash |"
          }

          $summary = @(
            '### ChatNicer x64',
            '',
            '| Variante | Bytes | Budget | Status | SHA256 |',
            '| --- | ---: | ---: | --- | --- |'
          ) + $rows
          $summary -join "`n" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

          if ($failed) { exit 1 }

      - name: Artefakte hochladen
        uses: actions/upload-artifact@v4
        with:
          name: ChatNicer-x64
          path: |
            build/ChatNicer.exe
            build/ChatNicer-compat.exe
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  #  Gegenprobe ueber die Solution. Zweck ist nicht die EXE, sondern dass
  #  ChatNicer.vcxproj nicht verrottet: Flags und Bibliotheken stehen doppelt
  #  (build.bat und vcxproj), und wer nur eine Seite pflegt, merkt es sonst erst,
  #  wenn jemand aus der IDE heraus baut.
  # ---------------------------------------------------------------------------
  msbuild:
    name: MSBuild-Gegenprobe (Release|x64)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: MSBuild bereitstellen
        uses: microsoft/setup-msbuild@v2

      - name: Solution bauen
        shell: cmd
        run: msbuild ChatNicer.sln /nologo /m /p:Configuration=Release /p:Platform=x64

      - name: Ergebnis pruefen
        shell: pwsh
        run: |
          $exe = 'build\Release\ChatNicer.exe'
          if (-not (Test-Path $exe)) {
            Write-Host "::error::$exe wurde nicht erzeugt"
            exit 1
          }
          $size = (Get-Item $exe).Length
          Write-Host "MSBuild-Release: $size Bytes"
          if ($size -gt 204800) {
            Write-Host "::error::MSBuild-Release ueber dem Budget von 204800 Bytes"
            exit 1
          }

  # ---------------------------------------------------------------------------
  #  Rollendes Release "latest": bei jedem Push auf main wird der Stand als
  #  Prerelease veroeffentlicht, Tag und Assets werden dabei ersetzt. Laeuft nur
  #  auf main und nur, wenn beide Build-Jobs gruen sind - ein Release, das das
  #  Groessenbudget reisst oder die Solution zerlegt, soll niemand herunterladen.
  #
  #  Bewusst nur ChatNicer.exe: die compat-Variante ist der Notnagel fuer Systeme
  #  ohne aktuelle UCRT und liegt derzeit ueber dem Budget. Wer sie braucht, holt
  #  sie aus dem Build-Artefakt oder baut selbst.
  # ---------------------------------------------------------------------------
  release:
    name: Rolling Release (latest)
    needs: [ build, msbuild ]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: windows-latest

    permissions:
      contents: write

    # Releases duerfen sich nicht ueberholen: zwei schnell aufeinanderfolgende
    # Pushes wuerden sonst gleichzeitig am Tag "latest" arbeiten.
    concurrency:
      group: release-latest
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Gebaute EXE holen
        uses: actions/download-artifact@v4
        with:
          name: ChatNicer-x64
          path: dist

      - name: Release-Notes schreiben
        shell: pwsh
        run: |
          $exe = 'dist\ChatNicer.exe'
          if (-not (Test-Path $exe)) {
            Write-Host "::error::$exe fehlt im Artefakt"
            exit 1
          }

          $size  = (Get-Item $exe).Length
          $hash  = (Get-FileHash $exe -Algorithm SHA256).Hash
          $sha   = $env:GITHUB_SHA
          $short = $sha.Substring(0, 7)
          $repo  = $env:GITHUB_REPOSITORY
          # Commit-Titel ueber git statt ueber github.event.head_commit.message:
          # eine Commit-Message direkt in den Skripttext zu interpolieren ist der
          # klassische Weg, sich Fremdcode in den Runner zu holen.
          $subject = git log -1 --pretty=format:%s $sha
          if ([string]::IsNullOrWhiteSpace($subject)) { $subject = '(kein Commit-Titel)' }
          $subject = $subject -replace '\|', '\|'   # sonst zerlegt er die Tabelle
          $built = [datetime]::UtcNow.ToString('yyyy-MM-dd HH:mm') + ' UTC'

          # Zeilenarray statt Here-String: dessen Inhalt muesste in Spalte 0 stehen
          # und wuerde den YAML-Block sprengen. Nebeneffekt, der hier passt: in
          # einfachen Anfuehrungszeichen ist der Backtick fuer Markdown-Code
          # literal, statt PowerShells Escape-Zeichen zu sein.
          #
          # Der Hash gehoert in die Notes: die EXE ist unsigniert, er ist fuer den
          # Nutzer der einzige Weg, den Download gegen das Repo zu pruefen (README,
          # Abschnitt "Download pruefen").
          $notes = @(
            'Automatischer Build vom letzten Stand auf `main`.'
            'Dieses Release wird bei jedem weiteren Push auf `main` ueberschrieben.'
            ''
            '| | |'
            '| --- | --- |'
            "| Commit | [$short](https://github.com/$repo/commit/$sha) - $subject |"
            "| Gebaut | $built |"
            "| Groesse | $size Bytes |"
            ''
            '**SHA256 (ChatNicer.exe)**'
            ''
            '```'
            $hash
            '```'
            ''
            'Nachrechnen: `Get-FileHash .\ChatNicer.exe -Algorithm SHA256`'
            ''
            'Die EXE ist unsigniert - beim ersten Start meldet sich SmartScreen'
            '(*Weitere Informationen* -> *Trotzdem ausfuehren*). Hintergrund und die'
            'compat-Variante fuer Systeme ohne aktuelle UCRT: siehe README.'
          )

          $notes -join "`n" | Out-File -FilePath 'notes.md' -Encoding utf8
          "$hash  ChatNicer.exe ($size Bytes)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

          # Sonst uebernimmt der Step den Exit-Code des letzten nativen Aufrufs (git).
          exit 0

      - name: Release veroeffentlichen
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Altes Release samt Tag abraeumen, damit "latest" danach wirklich auf
          # diesen Commit zeigt - ein blosses Asset-Update wuerde den Tag auf dem
          # alten Stand stehen lassen. Beim allerersten Lauf gibt es noch keines,
          # deshalb wird die Existenz geprueft statt den Fehler zu schlucken.
          gh release view latest --json tagName | Out-Null
          if ($LASTEXITCODE -eq 0) {
            gh release delete latest --yes --cleanup-tag
            if ($LASTEXITCODE -ne 0) {
              Write-Host "::error::Altes Release 'latest' konnte nicht entfernt werden"
              exit 1
            }
          } else {
            Write-Host "Kein bestehendes Release 'latest' - wird neu angelegt."
          }

          gh release create latest `
            'dist/ChatNicer.exe' `
            --target $env:GITHUB_SHA `
            --title 'ChatNicer - letzter Stand auf main' `
            --notes-file notes.md `
            --prerelease
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::Release konnte nicht erstellt werden"
            exit 1
          }

          Write-Host "Veroeffentlicht: https://github.com/$env:GITHUB_REPOSITORY/releases/tag/latest"
