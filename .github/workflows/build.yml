name: Build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  # Auf main NICHT abbrechen: dort haengt das Release am Lauf, und ein mitten im
  # Veroeffentlichen abgeschossener Job kann den Tag geloescht und das Release noch
  # nicht angelegt haben. PR-Laeufe duerfen sich weiter gegenseitig ersetzen.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  #  Der Weg, den auch ein Entwickler lokal geht: build.bat, beide Varianten.
  #  build.bat sucht sich die VS-Umgebung selbst (vswhere), auf dem Runner ist
  #  VS 2022 mit den VC++-Tools vorinstalliert - kein Setup-Schritt noetig.
  # ---------------------------------------------------------------------------
  build:
    name: build.bat (Standard + compat)
    runs-on: windows-latest

    env:
      # Groessenbudget aus CLAUDE.md: 200 KB = 204.800 Bytes.
      SIZE_BUDGET: '204800'
      # Die compat-Variante liegt derzeit bewusst darueber (siehe CLAUDE.md,
      # Abschnitt "Harte Randbedingungen"). Auf 'true' setzen, sobald sie wieder
      # unter dem Budget liegt - dann bricht der Lauf statt nur zu warnen.
      ENFORCE_COMPAT_BUDGET: 'false'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Standard-Release bauen
        shell: cmd
        run: build.bat

      - name: compat-Variante bauen
        shell: cmd
        run: build.bat compat

      - name: Groesse gegen Budget pruefen
        shell: pwsh
        run: |
          $budget = [int]$env:SIZE_BUDGET
          $enforceCompat = $env:ENFORCE_COMPAT_BUDGET -eq 'true'
          $failed = $false

          $variants = @(
            @{ File = 'build\ChatNicer.exe';        Enforce = $true },
            @{ File = 'build\ChatNicer-compat.exe'; Enforce = $enforceCompat }
          )

          $rows = @()
          foreach ($v in $variants) {
            if (-not (Test-Path $v.File)) {
              Write-Host "::error::$($v.File) wurde nicht erzeugt"
              $failed = $true
              continue
            }

            $name = Split-Path $v.File -Leaf
            $size = (Get-Item $v.File).Length
            $hash = (Get-FileHash $v.File -Algorithm SHA256).Hash

            if ($size -gt $budget) {
              $over = $size - $budget
              $msg  = "$name : $size Bytes, $over Bytes ueber dem Budget von $budget Bytes"
              if ($v.Enforce) {
                Write-Host "::error::$msg"
                $failed = $true
                $status = 'ueber Budget'
              } else {
                Write-Host "::warning::$msg"
                $status = 'ueber Budget (geduldet)'
              }
            } else {
              $status = "ok ($($budget - $size) Bytes Reserve)"
            }

            Write-Host "$name : $size Bytes - $status"
            Write-Host "  SHA256 $hash"
            $rows += "| $name | $size | $budget | $status | $hash |"
          }

          $summary = @(
            '### ChatNicer x64',
            '',
            '| Variante | Bytes | Budget | Status | SHA256 |',
            '| --- | ---: | ---: | --- | --- |'
          ) + $rows
          $summary -join "`n" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

          if ($failed) { exit 1 }

      - name: Artefakte hochladen
        uses: actions/upload-artifact@v4
        with:
          name: ChatNicer-x64
          path: |
            build/ChatNicer.exe
            build/ChatNicer-compat.exe
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  #  Gegenprobe ueber die Solution. Zweck ist nicht die EXE, sondern dass
  #  ChatNicer.vcxproj nicht verrottet: Flags und Bibliotheken stehen doppelt
  #  (build.bat und vcxproj), und wer nur eine Seite pflegt, merkt es sonst erst,
  #  wenn jemand aus der IDE heraus baut.
  # ---------------------------------------------------------------------------
  msbuild:
    name: MSBuild-Gegenprobe (Release|x64)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: MSBuild bereitstellen
        uses: microsoft/setup-msbuild@v2

      - name: Solution bauen
        shell: cmd
        run: msbuild ChatNicer.sln /nologo /m /p:Configuration=Release /p:Platform=x64

      - name: Ergebnis pruefen
        shell: pwsh
        run: |
          $exe = 'build\Release\ChatNicer.exe'
          if (-not (Test-Path $exe)) {
            Write-Host "::error::$exe wurde nicht erzeugt"
            exit 1
          }
          $size = (Get-Item $exe).Length
          Write-Host "MSBuild-Release: $size Bytes"
          if ($size -gt 204800) {
            Write-Host "::error::MSBuild-Release ueber dem Budget von 204800 Bytes"
            exit 1
          }

  # ---------------------------------------------------------------------------
  #  Veroeffentlichung: Jeder Push auf main wird ein durchnummeriertes Release
  #  v1.x. Laeuft nur auf main und nur, wenn beide Build-Jobs gruen sind - ein
  #  Release, das das Groessenbudget reisst oder die Solution zerlegt, soll
  #  niemand herunterladen.
  #
  #  Die Nummer, den Changelog-Abschnitt, die Landingpage und die Release-Notes
  #  macht .github/scripts/Publish-Release.ps1. Hier steht nur, was ohne
  #  GitHub-Token ohnehin nicht laufen koennte: committen, taggen, hochladen.
  #
  #  Bewusst nur ChatNicer.exe als Asset: die compat-Variante ist der Notnagel
  #  fuer Systeme ohne aktuelle UCRT und liegt derzeit ueber dem Budget. Wer sie
  #  braucht, holt sie aus dem Build-Artefakt oder baut selbst.
  # ---------------------------------------------------------------------------
  release:
    name: Release veroeffentlichen (v1.x)
    needs: [ build, msbuild ]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: windows-latest

    permissions:
      contents: write

    # Releases duerfen sich nicht ueberholen: Zwei schnell aufeinanderfolgende
    # Pushes wuerden sonst dieselbe Nummer vergeben.
    concurrency:
      group: release-main
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # fetch-depth: 0 ist Pflicht - ohne die Tags kennt das Skript die
          # zuletzt vergebene Version nicht und faengt wieder bei vorn an.
          fetch-depth: 0
          ref: main

      - name: Gebaute EXE holen
        uses: actions/download-artifact@v4
        with:
          name: ChatNicer-x64
          path: dist

      - name: Version, Changelog, Landingpage und Notes vorbereiten
        id: prepare
        shell: pwsh
        run: |
          .\.github\scripts\Publish-Release.ps1 `
            -ExePath 'dist\ChatNicer.exe' `
            -CompatExePath 'dist\ChatNicer-compat.exe' `
            -RepoRoot '.' `
            -CommitSha $env:GITHUB_SHA `
            -NotesPath (Join-Path $env:RUNNER_TEMP 'release-notes.md')

      - name: Changelog und Landingpage zuruecknehmen nach main
        id: commit
        shell: pwsh
        env:
          TAG: ${{ steps.prepare.outputs.tag }}
        run: |
          # git diff --cached --quiet meldet Unterschiede ueber den Exit-Code.
          # Neuere PowerShell-Versionen machen daraus einen terminierenden Fehler,
          # sobald $ErrorActionPreference auf Stop steht - und genau das tut es in
          # jedem pwsh-Step von GitHub Actions.
          $PSNativeCommandUseErrorActionPreference = $false

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # Nur diese beiden Dateien - die EXE im Release stammt aus dem Commit
          # davor, und nur weil dieser Commit nichts am Code aendert, ist sie
          # trotzdem der Stand des Tags.
          git add CHANGELOG.md docs/index.html
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host "::error::Weder CHANGELOG.md noch docs/index.html haben sich geaendert - das Release-Skript hat nichts bewirkt."
            exit 1
          }

          # [skip ci] ist der Guertel: Ein Push mit GITHUB_TOKEN loest ohnehin
          # keinen weiteren Workflow aus (sonst liefe das hier endlos), aber wer
          # den Token spaeter gegen einen PAT tauscht, faellt sonst in die Falle.
          git commit -m "Release $env:TAG [skip ci]"

          # Zwischen Checkout und Push kann jemand gepusht haben. Einmal rebasen,
          # dann muss es sitzen: Ein zweiter Versuch koennte auf einem Stand
          # landen, fuer den die Nummer bereits vergeben wurde.
          git pull --rebase origin main
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::Rebase auf origin/main fehlgeschlagen - bitte von Hand nachziehen."
            exit 1
          }
          git push origin HEAD:main
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::Push nach main fehlgeschlagen (geschuetzter Branch?)."
            exit 1
          }

          # Der Tag soll auf den Commit zeigen, der seinen eigenen
          # Changelog-Eintrag enthaelt - deshalb erst jetzt den SHA merken.
          "release_sha=$(git rev-parse HEAD)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          exit 0

      - name: Release anlegen
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.prepare.outputs.tag }}
          VERSION: ${{ steps.prepare.outputs.version }}
          RELEASE_SHA: ${{ steps.commit.outputs.release_sha }}
        run: |
          gh release create $env:TAG `
            'dist/ChatNicer.exe' `
            --target $env:RELEASE_SHA `
            --title "ChatNicer $env:VERSION" `
            --notes-file (Join-Path $env:RUNNER_TEMP 'release-notes.md') `
            --latest
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::Release $env:TAG konnte nicht erstellt werden"
            exit 1
          }
          Write-Host "Veroeffentlicht: https://github.com/$env:GITHUB_REPOSITORY/releases/tag/$env:TAG"

      # Uebergangsschritt: Vor der Umstellung hing alles am rollenden Prerelease
      # "latest". Ein Tag dieses Namens steht dem GitHub-eigenen Begriff
      # /releases/latest im Weg, auf den die Landingpage frueher verwiesen hat.
      # Sobald er einmal weg ist, kann dieser Schritt entfallen.
      - name: Altes Prerelease "latest" abraeumen
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Bewusst ohne if: always() - schlaegt das neue Release fehl, bleibt das
          # alte stehen, statt dass gar nichts mehr zum Herunterladen da ist.
          $PSNativeCommandUseErrorActionPreference = $false
          gh release view latest --json tagName 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            gh release delete latest --yes --cleanup-tag
            Write-Host "Altes Prerelease 'latest' entfernt."
          } else {
            Write-Host "Kein Release 'latest' vorhanden - nichts zu tun."
          }
          exit 0
